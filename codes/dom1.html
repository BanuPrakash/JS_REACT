<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Delete</th>
            </tr>
        </thead>
        <tbody id="userTable">
        </tbody>
    </table>

    <script>
        let table_body = document.getElementById("userTable");
        fetch("https://jsonplaceholder.typicode.com/users")
        .then(response => response.json())
        .then(users => {
            users.forEach(user => {
                 let tr = document.createElement("tr"); // <tr>
                 let td = document.createElement("td"); //<td>
                 let txtnode = document.createTextNode(user.id);
                 td.append(txtnode);
                 tr.append(td);

                 td = document.createElement("td"); //<td>
                 txtnode = document.createTextNode(user.name);
                 td.append(txtnode);
                 tr.append(td);

                  td = document.createElement("td"); //<td>
                 txtnode = document.createTextNode(user.email);
                 td.append(txtnode);
                 tr.append(td);

                  td = document.createElement("td"); //<td>
                 let btn = document.createElement("button");
                 btn.setAttribute("class", "btn");
                 txtnode = document.createTextNode("DELETE");
                 btn.append(txtnode);
                 td.append(btn);
                 tr.append(td);
                
                 table_body.append(tr);
            })
           
        });
    </script>
</body>
</html>
