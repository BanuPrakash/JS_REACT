<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function doTask() {
            // pending --> fulfilled
            // pending --> rejected
            return new Promise( function(resolve, reject) {
                // async non blocking code
                // setTimeout(() => resolve("Products!!"), 2000);
                setTimeout(() => reject("404 Resource not found!!!"), 2000);
            });
        }
        doTask().then((data) => console.log(data), 
                (err) => console.log("Boom :-( " + err)); // non blocking

        console.log("Done!!!");
    </script>
</body>
</html>
